# 每新增一個工具就加一筆。slug 對應 /tools/<slug>/index.html
# 若工具放在別處，用 url 覆蓋。status: wip 會顯示「施工中」而不給連結。

- title: 座位表
  slug: seating-chart
  desc: 學生用手機在教室平面圖上點自己的座位、勾選幹部與小老師，教師端整理成可列印的座位表。資料存在教師自己的 Google 試算表。

- title: 座位表（研習示範版）
  slug: seating-chart-demo
  desc: 跟座位表是同一套工具，接到另一份只放虛擬學生資料的試算表，研習時可以直接操作學生端與教師端。
