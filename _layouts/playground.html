<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }} | {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/playground.css' | relative_url }}">
  <script>
    (function(){var m;try{m=localStorage.getItem('pg-theme');}catch(e){} if(m!=='dark'&&m!=='light')m=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',m);})();
  </script>
</head>
<body>
  <header class="pg-top">
    <a class="pg-home" href="{{ '/' | relative_url }}">← {{ site.title | escape }}</a>
    <div class="pg-top-actions">
      <input id="pg-search" type="search" placeholder="搜尋模擬器…" aria-label="搜尋">
      <button id="pg-theme" type="button" aria-label="切換深淺色">☾</button>
    </div>
  </header>

  {{ content }}

  <footer class="pg-foot">
    © {{ 'now' | date: '%Y' }} {{ site.social.name | default: site.title }} · CC BY 4.0
  </footer>
  <script src="{{ '/assets/js/playground.js' | relative_url }}"></script>
</body>
</html>
