<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雙狹縫干涉 3D 模擬</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #000;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #ui-container {
            position: absolute;
            z-index: 1;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            width: 280px;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 12px;
            border: 1px solid #00d2ff;
            border-radius: 5px;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover,
        .back-link:focus-visible {
            background-color: #00d2ff;
            color: #000;
        }

        h1 {
            font-size: 18px;
            margin-top: 0;
            margin-bottom: 15px;
            color: #00d2ff;
            text-align: center;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 5px;
            color: #ccc;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #00d2ff;
        }

        .value-display {
            font-weight: bold;
            color: #fff;
        }

        .instruction {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            line-height: 1.5;
            border-top: 1px solid #444;
            padding-top: 10px;
        }

        /* 新增按鈕樣式 */
        #pause-btn {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            background-color: #00d2ff;
            border: none;
            border-radius: 5px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        #pause-btn:hover {
            background-color: #33d9ff;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Load OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="loading">載入模型中...</div>

    <div id="ui-container">
        <a class="back-link" href="/playground/">← 回 Physics_Playground</a>
        <h1>雙狹縫干涉參數</h1>
        
        <div class="control-group">
            <label>
                波源距離 (Separation)
                <span id="val-separation" class="value-display">10.0</span>
            </label>
            <input type="range" id="separation" min="0" max="40" step="0.5" value="10.0">
        </div>

        <div class="control-group">
            <label>
                振幅 (Amplitude)
                <span id="val-amplitude" class="value-display">1.5</span>
            </label>
            <input type="range" id="amplitude" min="0.1" max="5.0" step="0.1" value="1.5">
        </div>

        <div class="control-group">
            <label>
                頻率/波數 (Frequency)
                <span id="val-frequency" class="value-display">1.0</span>
            </label>
            <input type="range" id="frequency" min="0.2" max="3.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <label>
                模擬速度 (Speed)
                <span id="val-speed" class="value-display">1.0</span>
            </label>
            <input type="range" id="speed" min="0" max="3.0" step="0.1" value="1.0">
        </div>

        <button id="pause-btn">暫停 (Pause)</button>

        <div class="instruction">
            • <b>已更新</b>：整體亮度提高<br>
            • <b>左鍵拖曳</b>：旋轉視角<br>
            • <b>右鍵拖曳</b>：平移視角<br>
            • <b>滾輪</b>：縮放遠近
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 全域變數
        let scene, camera, renderer, controls;
        let planeMesh, source1Mesh, source2Mesh;
        let time = 0;
        let isPaused = false; // 新增暫停狀態變數
        
        // 物理參數
        const params = {
            separation: 10.0, // 兩波源距離
            amplitude: 1.5,   // 振幅
            frequency: 1.0,   // 頻率 (控制波長)
            speed: 1.0        // 動畫速度
        };

        // 平面設定
        const PLANE_SIZE = 60;
        const SEGMENTS = 100; // 網格細緻度，越高越平滑但效能越吃重

        function init() {
            // 1. 場景設定
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.015);

            // 2. 相機設定
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            // 調整相機位置，稍微往後退並提高，以配合新的波源位置
            camera.position.set(0, 50, 60);
            camera.lookAt(0, 0, 0);

            // 3. 渲染器設定
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. 控制器 (OrbitControls)
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 5. 建立波的介質 (平面網格)
            // 使用 PlaneBufferGeometry 以獲得更好的效能
            const geometry = new THREE.PlaneGeometry(PLANE_SIZE, PLANE_SIZE, SEGMENTS, SEGMENTS);
            
            // 建立材質，使用 wireframe: false 來顯示實體，並開啟 vertexColors 以便我們手動上色
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xffffff, 
                side: THREE.DoubleSide,
                shininess: 80,
                vertexColors: true, // 重要：允許我們根據高度改變顏色
                flatShading: false
            });

            planeMesh = new THREE.Mesh(geometry, material);
            planeMesh.rotation.x = -Math.PI / 2; // 將平面放平
            scene.add(planeMesh);

            // 初始化頂點顏色屬性
            const count = geometry.attributes.position.count;
            geometry.setAttribute('color', new THREE.BufferAttribute(new Float32Array(count * 3), 3));

            // 6. 建立兩個波源標記 (黃色球體)
            const sphereGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const sphereMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
            
            source1Mesh = new THREE.Mesh(sphereGeo, sphereMat);
            source2Mesh = new THREE.Mesh(sphereGeo, sphereMat);
            
            scene.add(source1Mesh);
            scene.add(source2Mesh);

            // 7. 增加燈光 (亮度倍增)
            // 將環境光從 0x404040 提升到 0x808080
            const ambientLight = new THREE.AmbientLight(0x808080); 
            scene.add(ambientLight);

            // 將點光源強度從 1 提升到 2
            const pointLight = new THREE.PointLight(0xffffff, 2, 100);
            pointLight.position.set(0, 20, 0);
            scene.add(pointLight);

            // 將平行光強度從 0.8 提升到 1.6
            const dirLight = new THREE.DirectionalLight(0x00d2ff, 1.6);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 移除載入文字
            document.getElementById('loading').style.opacity = 0;

            // 綁定 UI 事件
            setupUI();

            // 開始動畫迴圈
            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function setupUI() {
            const sepInput = document.getElementById('separation');
            const ampInput = document.getElementById('amplitude');
            const freqInput = document.getElementById('frequency');
            const speedInput = document.getElementById('speed');
            const pauseBtn = document.getElementById('pause-btn');

            sepInput.addEventListener('input', (e) => {
                params.separation = parseFloat(e.target.value);
                document.getElementById('val-separation').innerText = params.separation.toFixed(1);
            });

            ampInput.addEventListener('input', (e) => {
                params.amplitude = parseFloat(e.target.value);
                document.getElementById('val-amplitude').innerText = params.amplitude.toFixed(1);
            });

            freqInput.addEventListener('input', (e) => {
                params.frequency = parseFloat(e.target.value);
                document.getElementById('val-frequency').innerText = params.frequency.toFixed(1);
            });

            speedInput.addEventListener('input', (e) => {
                params.speed = parseFloat(e.target.value);
                document.getElementById('val-speed').innerText = params.speed.toFixed(1);
            });

            // 暫停按鈕邏輯
            pauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                pauseBtn.innerText = isPaused ? "繼續 (Resume)" : "暫停 (Pause)";
                
                // 改變按鈕顏色以提示狀態
                pauseBtn.style.backgroundColor = isPaused ? "#ffaa00" : "#00d2ff";
            });
        }

        function updateWaves() {
            // 定義波源在平面上的 Y 軸位置 (Local Coordinates)
            // PLANE_SIZE = 60, 範圍是 -30 到 +30
            // 將波源移到底部邊緣附近 (-28)
            const sourceLocalY = -PLANE_SIZE / 2 + 2; 

            // 更新波源顯示位置 (World Coordinates)
            // 因為平面繞 X 軸轉了 -90度，所以 Local Y 的負值對應 World Z 的正值
            // Local Y = -28 -> World Z = +28
            const sourceWorldZ = -sourceLocalY;

            const halfSep = params.separation / 2;
            source1Mesh.position.set(-halfSep, 0, sourceWorldZ);
            source2Mesh.position.set(halfSep, 0, sourceWorldZ);

            // 取得平面的頂點資料
            const positionAttribute = planeMesh.geometry.attributes.position;
            const colorAttribute = planeMesh.geometry.attributes.color;
            
            const positions = positionAttribute.array;
            const colors = colorAttribute.array;
            const vertexCount = positionAttribute.count;

            // 波的參數
            // k = 2 * PI / wavelength. 這裡簡化直接用 frequency 當作係數
            const k = params.frequency; 
            const t = time;
            const A = params.amplitude;

            // 波源座標 (在平面的 Local 座標系中)
            const s1x = -halfSep;
            const s1y = sourceLocalY; 
            
            const s2x = halfSep;
            const s2y = sourceLocalY;

            for (let i = 0; i < vertexCount; i++) {
                // 取得頂點座標
                const x = positions[i * 3];
                const y = positions[i * 3 + 1];
                
                // 計算到兩個波源的距離
                const dist1 = Math.sqrt((x - s1x) ** 2 + (y - s1y) ** 2);
                const dist2 = Math.sqrt((x - s2x) ** 2 + (y - s2y) ** 2);

                // 計算波的疊加 (Superposition)
                const wave1 = A * Math.sin(k * dist1 - t);
                const wave2 = A * Math.sin(k * dist2 - t);
                
                // 衰減因子
                // 由於距離變長了，稍微調整衰減參數讓波能傳得更遠
                const decay1 = Math.max(0.1, 20 / (dist1 + 5)); 
                const decay2 = Math.max(0.1, 20 / (dist2 + 5));

                // 總位移 Z
                let z = (wave1 * decay1) + (wave2 * decay2);

                positions[i * 3 + 2] = z;

                // 根據高度上色
                const normalizedH = (z / (A * 2)) + 0.5; 
                
                const r = Math.max(0, normalizedH - 0.5) * 2; 
                const g = Math.max(0, normalizedH - 0.2);     
                const b = 0.5 + normalizedH * 0.5;            

                colors[i * 3] = Math.min(1, r * 0.8);     
                colors[i * 3 + 1] = Math.min(1, g + 0.2); 
                colors[i * 3 + 2] = Math.min(1, b);       
            }

            // 標記需要更新
            positionAttribute.needsUpdate = true;
            colorAttribute.needsUpdate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // 只有在未暫停時才更新時間與波形
            if (!isPaused) {
                // 更新時間
                time += 0.1 * params.speed;

                // 計算物理與更新幾何圖形
                updateWaves();
            }

            // 始終渲染場景，以便暫停時仍可旋轉視角
            controls.update();
            renderer.render(scene, camera);
        }

        // 啟動程式
        init();

    </script>
</body>
</html>
